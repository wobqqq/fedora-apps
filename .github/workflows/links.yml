name: Download links

# The scripts install the latest upstream releases; a renamed asset or a dropped
# checksum file breaks them without any change here. Checked every week.

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '*.sh'
      - 'lib/**'
      - 'tools/check-links.sh'

permissions:
  contents: read

jobs:
  links:
    name: Every download still resolves
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make links
        env:
          GITHUB_TOKEN: ${{ github.token }}
